<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · FocusBoard VR</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" style="max-width:460px">
  <div class="eyebrow">HANDS-FIRST FOCUS DESK</div>
  <h1>FocusBoard VR</h1>
  <p class="sub">Sign in to keep your notes across sessions and devices.</p>
  <div class="card">
    <form id="f">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:18px">
        <button type="submit" id="go" style="flex:1">Sign in</button>
      </div>
      <div id="msg" class="msg" role="alert"></div>
    </form>
  </div>
  <p class="foot">New here? <a href="register.html">Create an account</a> · <a href="board.html">Board</a> · <a href="privacy.html">Privacy</a></p>
</div>
<script src="app.js"></script>
<script>
loadConfig().then(() => {
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const m = document.getElementById('msg'), b = document.getElementById('go');
    b.disabled = true; msg(m, 'Signing in…', 'ok');
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value }) });
      saveToken(r.token); location.href = 'board.html';
    } catch (err) { msg(m, err.message, 'err'); b.disabled = false; }
  });
});
</script>
</body>
</html>
